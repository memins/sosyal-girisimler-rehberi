<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
	<defs>
		<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
			<stop offset="0%" stop-color="#fafbf9"/>
			<stop offset="100%" stop-color="#f3eedb"/>
		</linearGradient>
		<radialGradient id="accent" cx="85%" cy="15%" r="55%">
			<stop offset="0%" stop-color="#e3c97c" stop-opacity="0.45"/>
			<stop offset="100%" stop-color="#e3c97c" stop-opacity="0"/>
		</radialGradient>
		<pattern id="dots" x="0" y="0" width="32" height="32" patternUnits="userSpaceOnUse">
			<circle cx="1" cy="1" r="1" fill="#1a1a1a" fill-opacity="0.06"/>
		</pattern>
	</defs>

	<rect width="1200" height="630" fill="url(#bg)"/>
	<rect width="1200" height="630" fill="url(#dots)"/>
	<rect width="1200" height="630" fill="url(#accent)"/>

	<!-- Top accent line -->
	<rect x="0" y="0" width="1200" height="6" fill="#3a7d44"/>

	<!-- Logomark scaled up: original 32x32, scale 7 → 224x224, placed at (96, 110) -->
	<g transform="translate(96, 110) scale(7)">
		
		<circle cx="16" cy="25.5" r="2.4" fill="#3a7d44"/>
		<path d="M16 23.5 C 16 19 16 15.5 16 13" stroke="#3a7d44" stroke-width="1.6" stroke-linecap="round" fill="none"/>
		<path d="M 16 14 C 16 9.5 19 5.5 25 6.5 C 24 11.5 20.5 15 16 14 Z" fill="#3a7d44"/>
		<path d="M 16 16.5 C 16 13 13 9.5 7.5 10.5 C 8.5 14.5 12.5 17.5 16 16.5 Z" fill="#3a7d44" fill-opacity="0.55"/>
	
	</g>

	<!-- Wordmark -->
	<g font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif">
		<text x="370" y="240" font-size="72" font-weight="600" fill="#1a1a1a" letter-spacing="-1">Sosyal Girişimler</text>
		<text x="370" y="282" font-size="18" font-weight="600" fill="#6e6a62" letter-spacing="6">REHBERİ</text>

		<!-- Tagline -->
		<text x="96" y="430" font-size="34" font-weight="500" fill="#1a1a1a" letter-spacing="-0.5">
			Türkiye ve dünyadan sosyal girişimleri keşfet.
		</text>
		<text x="96" y="478" font-size="22" font-weight="400" fill="#6e6a62">
			Alan, hedef kitle, ülke ve Sürdürülebilir Kalkınma Amaçları üzerinden tara.
		</text>

		<!-- Bottom URL -->
		<text x="96" y="585" font-size="16" font-weight="500" fill="#6e6a62" letter-spacing="2">
			SOSYAL GİRİŞİMLER · AÇIK · GÖNÜLLÜ · TÜRKÇE
		</text>
	</g>

	<!-- SDG color row, bottom-right -->
	<circle cx="678" cy="555" r="11" fill="#E5243B"/><circle cx="708" cy="555" r="11" fill="#DDA63A"/><circle cx="738" cy="555" r="11" fill="#4C9F38"/><circle cx="768" cy="555" r="11" fill="#C5192D"/><circle cx="798" cy="555" r="11" fill="#FF3A21"/><circle cx="828" cy="555" r="11" fill="#26BDE2"/><circle cx="858" cy="555" r="11" fill="#FCC30B"/><circle cx="888" cy="555" r="11" fill="#A21942"/><circle cx="918" cy="555" r="11" fill="#FD6925"/><circle cx="948" cy="555" r="11" fill="#DD1367"/><circle cx="978" cy="555" r="11" fill="#FD9D24"/><circle cx="1008" cy="555" r="11" fill="#BF8B2E"/><circle cx="1038" cy="555" r="11" fill="#3F7E44"/><circle cx="1068" cy="555" r="11" fill="#0A97D9"/><circle cx="1098" cy="555" r="11" fill="#56C02B"/><circle cx="1128" cy="555" r="11" fill="#00689D"/><circle cx="1158" cy="555" r="11" fill="#19486A"/>
</svg>
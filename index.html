<!doctype html>
<html lang="tr">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta
			name="description"
			content="Türkiye'den ve dünyadan sosyal girişimleri keşfetmek için dijital rehber."
		/>
		<title>Sosyal Girişimler Rehberi</title>
		<script>
			(function () {
				try {
					var stored = localStorage.getItem('sgr-theme');
					var resolved = 'light';
					if (stored === 'dark') {
						resolved = 'dark';
					} else if (stored === 'system') {
						resolved = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
					}
					if (resolved === 'dark') document.documentElement.classList.add('dark');
				} catch (e) {}
			})();
		</script>
	</head>
	<body>
		<div id="root"></div>
		<script type="module" src="/src/main.tsx"></script>
	</body>
</html>
